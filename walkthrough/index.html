<title>Prosecutor Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a presenter stage. Scene text on the left, an animated table of five agents on the right, controls underneath. */
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#16202e; --muted:#5d6b7e; --line:#dde3ea;
  --accent:#2f5bd3; --soft:#e3eafb; --good:#1f8a5b; --warn:#c98a12; --bad:#c8402f; --base:#8a94a3;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--panel:#171e29;--ink:#e7ecf3;--muted:#9aa6b6;--line:#2a3443;--accent:#7d9cff;--soft:#1f2a44;--good:#46c08a;--warn:#e3a93a;--bad:#ef6b58;--base:#7f8a99;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--panel:#171e29;--ink:#e7ecf3;--muted:#9aa6b6;--line:#2a3443;--accent:#7d9cff;--soft:#1f2a44;--good:#46c08a;--warn:#e3a93a;--bad:#ef6b58;--base:#7f8a99;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance} h1{font-size:24px} h2{font-size:26px}
.muted{color:var(--muted)}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:520px}
@media (max-width:860px){.deck{grid-template-columns:minmax(0,1fr)}}
.text{display:grid;gap:12px;align-content:start;min-width:0}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.text p{margin:0;max-width:60ch}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{padding:8px 10px;border-radius:8px;background:var(--soft);font-size:14px}
.facts li.bad{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.facts li.good{background:color-mix(in srgb,var(--good) 14%,var(--panel))}
svg{width:100%;height:auto;display:block;max-width:100%}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dots button{width:12px;height:12px;padding:0;border-radius:50%}
.dots button[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:dash .9s ease forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header style="display:grid;gap:4px">
    <h1>Prosecutor Walkthrough</h1>
    <p class="muted">How we find the one rogue among five agents without firing the honest ones. Real game #7 from the held-out set, then the numbers. Use → / ← or the buttons.</p>
  </header>
  <section class="deck" aria-live="polite">
    <div class="text" id="text"></div>
    <div id="stagebox"><svg id="stage" viewBox="0 0 520 440" role="img" aria-label="Animated scene"></svg></div>
  </section>
  <div class="controls">
    <button id="prev">← Back</button><button id="next" class="primary">Next →</button><button id="auto">Autoplay</button>
    <div class="dots" id="dots" role="tablist" aria-label="Scenes"></div>
  </div>
</div>

<script>

const G = W.game, AG=["Ada","Ben","Cy","Dee","Eli"], HUE={Ada:210,Ben:280,Cy:20,Dee:160,Eli:330};

const P={}; AG.forEach((a,i)=>{const t=-Math.PI/2+i*2*Math.PI/5; P[a]=[190+130*Math.cos(t),210+130*Math.sin(t)];});

function table(o){ // o: {round, out:[], post, showAns, judges, verdict, note, ledger}
  const ink=css("--ink"),mut=css("--muted"),bad=css("--bad"),acc=css("--accent"),good=css("--good"),line=css("--line");
  let s="";

  s+=`<text x="190" y="200" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="${mut}">${o.ledgerLabel||"LEDGER OFF BY"}</text>`;
  s+=`<text x="190" y="228" text-anchor="middle" font-family="var(--display)" font-size="24" fill="${(o.ledger||0)>0?bad:ink}">${o.ledgerText??fmt(o.ledger||0)}</text>`;
  const rd=o.round?R(o.round):null;
  if(rd&&o.showAns){ const [a,b]=Object.keys(rd.ans), dis=rd.ans[a]!==rd.ans[b];
    s+=`<line class="draw" x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="${dis?bad:acc}" stroke-width="3"/>`;
    (o.judges?[rd.ret,rd.ret2].filter(Boolean):[]).forEach((j,i)=>{const mx=(P[a][0]+P[b][0])/2,my=(P[a][1]+P[b][1])/2;
      s+=`<line class="draw" style="animation-delay:${.5+i*.5}s" x1="${P[j.n][0]}" y1="${P[j.n][1]}" x2="${mx}" y2="${my}" stroke="${acc}" stroke-width="2" stroke-dasharray="6 5"/>`;});
  }
  AG.forEach(n=>{const [x,y]=P[n], out=(o.out||[]).includes(n), p=o.post?o.post[n]:null;
    s+=`<g opacity="${out?.3:1}">`;
    if(p!=null) s+=`<circle cx="${x}" cy="${y}" r="34" fill="none" stroke="${line}" stroke-width="6"/><circle cx="${x}" cy="${y}" r="34" fill="none" stroke="${p>=.7?bad:p>=.4?css("--warn"):acc}" stroke-width="6" stroke-dasharray="${(2*Math.PI*34*p).toFixed(1)} 999" transform="rotate(-90 ${x} ${y})" style="transition:stroke-dasharray .6s"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="25" fill="hsl(${HUE[n]} 55% 52%)"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="14" fill="#fff">${n}</text>`;
    if(p!=null) s+=`<text x="${x}" y="${y+52}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="${p>=.7?bad:mut}">${Math.round(100*p)}%</text>`;
    if(out) s+=`<text x="${x}" y="${y-42}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="${bad}">QUARANTINED</text>`;
    if(rd&&o.showAns&&n in rd.ans){const v=rd.ans[n],off=v-rd.truth; s+=`<text class="pop" x="${x}" y="${y-42}" text-anchor="middle" font-family="var(--mono)" font-size="13" font-weight="600" fill="${off?bad:ink}">${fmt(v)}${off?` (${off>0?"+":""}${off})`:""}</text>`;}
    if(rd&&o.judges){[rd.ret,rd.ret2].filter(Boolean).forEach((j,i)=>{ if(j.n===n) s+=`<text class="pop" style="animation-delay:${.6+i*.5}s" x="${x}" y="${y-42}" text-anchor="middle" font-family="var(--mono)" font-size="13" fill="${acc}">judge ${i+1}: ${fmt(j.a)}</text>`;});}
    s+=`</g>`;});
  if(o.banner) s+=`<g class="pop" style="animation-delay:${o.bannerDelay||0}s"><rect x="345" y="${o.bannerY||20}" width="165" height="${o.bannerH||54}" rx="8" fill="${o.bannerColor||acc}"/><text x="427" y="${(o.bannerY||20)+22}" text-anchor="middle" font-family="var(--display)" font-size="14" fill="#fff">${o.banner[0]}</text><text x="427" y="${(o.bannerY||20)+41}" text-anchor="middle" font-family="var(--body)" font-size="12" fill="#fff">${o.banner[1]||""}</text></g>`;
  if(o.side) s+=o.side;
  return s;
}
function bars(groups, max, unit, title){ // groups: [{label, items:[{name,v,color}]}]

 {k:"How it works · four layers", h:"Detect, verify, contain, prove.",

 {k:"How we got here", h:"Baseline → v1 → v2, on 500 held-out games.",

 {k:"Limits and accountability", h:"What it does not do, and who answers for it.",

let i=0, timer=null;
function show(n){ i=Math.max(0,Math.min(SCENES.length-1,n)); const S=SCENES[i];
  $("text").innerHTML=`<div class="fade"><div class="kicker">${i+1} / ${SCENES.length} · ${S.k}</div></div><h2 class="fade">${S.h}</h2>${S.p?`<p class="fade">${S.p}</p>`:""}<ul class="facts fade">${S.f.map(([t,c])=>`<li class="${c}">${t}</li>`).join("")}</ul>`;
  $("stage").innerHTML=S.s();
  $("dots").innerHTML=SCENES.map((_,k)=>`<button aria-label="Scene ${k+1}" aria-current="${k===i}"></button>`).join("");
  [...$("dots").children].forEach((b,k)=>b.onclick=()=>{stopAuto();show(k);});
  $("prev").disabled=i===0; $("next").disabled=i===SCENES.length-1;
}
function stopAuto(){clearInterval(timer);timer=null;$("auto").textContent="Autoplay";}
$("next").onclick=()=>{stopAuto();show(i+1)}; $("prev").onclick=()=>{stopAuto();show(i-1)};
$("auto").onclick=()=>{ if(timer) return stopAuto(); $("auto").textContent="Pause"; timer=setInterval(()=>{ if(i>=SCENES.length-1) return stopAuto(); show(i+1); },7000); };
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){stopAuto();show(i+1);} if(e.key==="ArrowLeft"){stopAuto();show(i-1);} });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>show(i));
show(0);
</script>
